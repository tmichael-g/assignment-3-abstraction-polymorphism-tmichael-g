name: Autograding Tests
on:
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # --- 1. The Maven Test Runner ---
    - name: Smart Home OOP Test
      id: oop-test
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Abstraction and Polymorphism Logic
        setup-command: mvn -q clean compile
        command: mvn test
        # We look for "BUILD SUCCESS" which confirms all JUnit tests passed
        expected-output: "BUILD SUCCESS"
        comparison-method: contains
        timeout: 5
        max-score: 100

    # --- 2. The Reporter ---
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        OOP-TEST_RESULTS: "${{ steps.oop-test.outputs.result }}"
      with:
        runners: oop-test
